name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # go.mod declares go 1.26 — keep in sync with the Dockerfile build stage.
          go-version: '1.26'
          cache: true
      # sqlc version must match the committed generated code (models.go says v1.29.0)
      # or `sqlc generate` will produce a diff and the check below fails.
      - name: Install sqlc
        run: go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.29.0
      - name: Install goose
        run: go install github.com/pressly/goose/v3/cmd/goose@v3.24.3
      - name: Start Postgres
        run: |
          docker run -d --name pg \
            -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=medical \
            -p 5432:5432 postgres:16
          until docker exec pg pg_isready -U postgres; do sleep 1; done
      - name: Migrations apply from a clean DB
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/medical?sslmode=disable
        run: goose -dir migrations postgres "$DATABASE_URL" up
      - name: sqlc generate
        run: sqlc generate
      # Generated code is committed; this checks the commit matches the schema.
      - name: Check no diff (generated code is up to date)
        run: git diff --exit-code
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.62

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - name: Build all packages
        run: go build ./...
      - name: Build the two binaries
        run: |
          CGO_ENABLED=0 go build -o /tmp/api ./cmd/api
          CGO_ENABLED=0 go build -o /tmp/retention ./cmd/retention

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - name: Unit tests
        run: go test ./... -race -count=1 -timeout=5m
      # Real Postgres via testcontainers (one container for the whole suite).
      - name: Integration tests
        run: go test ./integration -tags=integration -race -count=1 -timeout=10m

  docker:
    runs-on: ubuntu-latest
    needs: [lint, build]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build api image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: api
          push: false
          cache-from: type=gha
          cache-to: type=gha, mode=max
      - name: Build retention image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: retention
          push: false
          cache-from: type=gha
          cache-to: type=gha, mode=max