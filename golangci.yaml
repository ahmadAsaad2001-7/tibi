run:
  timeout: 5m

linters:
  enable:
    - depguard
    - errcheck
    - govet
    - staticcheck
    - gosimple
    - ineffassign
    - unused
    - gofmt
    - goimports

linters-settings:
  depguard:
    rules:
      # Identity may only import its own packages, platform, and other modules' contracts.
      identity:
        files: ["**/internal/identity/**"]
        allow:
          - $gostd
          - tibi/internal/identity
          - tibi/internal/patients/contracts
          - tibi/internal/doctors/contracts
          - tibi/internal/platform
          - github.com/go-chi/chi/v5
          - github.com/go-playground/validator/v10
          - github.com/jackc/pgx/v5
          - github.com/golang-jwt/jwt/v5
          - github.com/google/uuid
          - github.com/alexedwards/argon2id

      patients:
        files: ["**/internal/patients/**"]
        allow:
          - $gostd
          - tibi/internal/patients
          - tibi/internal/platform
          - github.com/jackc/pgx/v5

      doctors:
        files: ["**/internal/doctors/**"]
        allow:
          - $gostd
          - tibi/internal/doctors
          - tibi/internal/platform
          - github.com/jackc/pgx/v5
          - github.com/go-playground/validator/v10
          - github.com/go-chi/chi/v5

      admin:
        files: ["**/internal/admin/**"]
        allow:
          - $gostd
          - tibi/internal/admin
          - tibi/internal/doctors/contracts
          - tibi/internal/identity/contracts
          - tibi/internal/platform
          - github.com/jackc/pgx/v5
          - github.com/go-chi/chi/v5
          - github.com/go-playground/validator/v10

      platform:
        files: ["**/internal/platform/**"]
        deny:
          - tibi/internal/identity
          - tibi/internal/patients
          - tibi/internal/doctors
          - tibi/internal/admin
          - tibi/internal/consultations
          - tibi/internal/payments
          - tibi/internal/doctorposts
          - tibi/internal/content
          - tibi/internal/queue
          - tibi/internal/files

      payments:
        files: ["**/internal/payments/**"]
        allow:
          - $gostd
          - tibi/internal/payments
          - tibi/internal/consultations/contracts
          - tibi/internal/platform
          - github.com/jackc/pgx/v5
          - github.com/go-chi/chi/v5

      consultations:
        files: ["**/internal/consultations/**"]
        allow:
          - $gostd
          - tibi/internal/consultations
          - tibi/internal/doctors/contracts
          - tibi/internal/payments/contracts
          - tibi/internal/platform
          - github.com/jackc/pgx/v5
          - github.com/go-chi/chi/v5
          - github.com/go-playground/validator/v10

      queue:
        files: ["**/internal/queue/**"]
        allow:
          - $gostd
          - tibi/internal/queue
          - tibi/internal/consultations/contracts
          - tibi/internal/platform
          - github.com/jackc/pgx/v5
          - github.com/go-chi/chi/v5
          - github.com/go-playground/validator/v10

      files:
        files: ["**/internal/files/**"]
        allow:
          - $gostd
          - tibi/internal/files
          - tibi/internal/platform
          - tibi/internal/storage
          - github.com/jackc/pgx/v5
          - github.com/go-chi/chi/v5











































